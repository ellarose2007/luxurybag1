{% extends "base.html" %}
{% block title %}{{ mode }} User{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ mode }} User</h1></div></div>
<div class="card">
<form method="post">
  <div class="form-grid">
    <div><label>Full name</label><input name="full_name" value="{{ u.get('full_name','') }}"></div>
    <div><label>Username</label><input name="username" value="{{ u.get('username','') }}"></div>
    <div><label>Email</label><input name="email" value="{{ u.get('email','') }}"></div>
    <div><label>Role</label>
      <select name="role">
        {% for r, t in [('admin','Administrator'),('staff','Inventory Staff'),('customer','Customer')] %}
        <option value="{{ r }}" {{ 'selected' if u.get('role') == r }}>{{ t }}</option>{% endfor %}
      </select></div>
    <div class="full"><label>Password {% if mode == 'Update' %}(leave blank to keep current){% endif %}</label>
      <input name="password" type="password"></div>
  </div>
  <p style="margin-top:18px">
    <button class="btn" type="submit">{{ 'Save User' if mode == 'Add' else 'Update User' }}</button>
    <a class="btn ghost" href="{{ url_for('users_list') }}">Cancel</a>
  </p>
</form></div>
{% endblock %}
